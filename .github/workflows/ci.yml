name: CI - Vérification du code Python

on:
  push:
    branches:
      - main

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3
      - name: Installer Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Installer flake8
        run: pip install flake8
      - name: Vérifier main.py
        run: flake8 main.py --max-line-length=120 --count --show-source
