<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Les réglages de base de ma page -->
    <meta charset="UTF-8" />
    <!-- Je m'assure que le site s'affiche parfaitement sur téléphone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IZMAR - Recommandation de Films</title>
    
    <!-- J'importe la police "Poppins" depuis Google Fonts pour donner un look beaucoup plus moderne à mon texte -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- J'utilise Bulma, c'est une boîte à outils visuelle qui me donne des jolis boutons et une bonne structure sans tout coder de zéro -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
    <!-- Ça me permet d'afficher des petites icônes sympa (comme les étoiles pour les notes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- J'ajoute "React", c'est le moteur interactif de mon site. Babel est là pour traduire mon code afin que le navigateur le lise sans problème -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Voici mon propre design personnalisé pour peaufiner l'apparence -->
    <style>
        /* J'applique ma nouvelle police sur tout le site et je mets une couleur de fond bleu nuit */
        body { 
            background-color: #1a1a2e; 
            min-height: 100vh; 
            font-family: 'Poppins', sans-serif;
        }
        
        /* Le bandeau d'accueil avec un beau dégradé de couleurs */
        .hero-izmar { 
            background: linear-gradient(135deg, #0f3460, #e94560); 
        }
        
        /* Je crée des boîtes de contenu avec des bords doux (arrondis) pour que ce soit agréable à l'œil */
        .box-sombre { 
            background-color: #16213e; 
            color: #ffffff; 
            border-radius: 15px; 
            border: 1px solid #2a3a5e;
        }
        
        .texte-clair { color: #cccccc; }
        
        /* J'arrondis aussi mes boutons de choix */
        .bouton-choix { 
            margin: 5px; 
            border-radius: 8px; 
        }
        
        /* L'effet magique quand on passe la souris sur un film : la carte remonte un peu avec une petite ombre */
        .carte-film {
            transition: all 0.3s ease;
        }
        .carte-film:hover { 
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
            transform: translateY(-5px); 
        }
        
        /* Je force toutes les affiches de films à avoir la même taille, le 'cover' permet de couper l'image proprement si besoin */
        .affiche-film {
            width: 120px;
            height: 180px;
            object-fit: cover; 
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- C'est dans cette boîte vide que mon code React va venir "dessiner" tout le site -->
    <div id="racine"></div>
    
    <script type="text/babel">
        
        // La grande fonction App qui contient toute la logique de mon interface
        function App() {
            
            // --- LA MÉMOIRE DE MON SITE (LES ÉTATS) ---
            
            // Je retiens sur quelle page l'utilisateur se trouve
            const [page, setPage] = React.useState("accueil"); 
            // S'il cherche par thème, je retiens à quelle question il en est (1, 2 ou 3)
            const [etapeTheme, setEtapeTheme] = React.useState(1); 
            
            // Je mémorise les choix qu'il fait en cliquant sur les boutons
            const [genre, setGenre] = React.useState(null); 
            const [nomGenre, setNomGenre] = React.useState(""); 
            const [ambiance, setAmbiance] = React.useState(null); 
            
            // Je mémorise le nom de l'acteur tapé au clavier
            const [acteurNom, setActeurNom] = React.useState(""); 
            const [acteurTrouve, setActeurTrouve] = React.useState(null); 
            
            // C'est ici que je stockerai la liste des films renvoyés par mon serveur Python
            const [films, setFilms] = React.useState([]); 
            // Je retiens si on est en train de chercher (pour afficher un logo d'attente)
            const [chargement, setChargement] = React.useState(false); 
            // Pour mémoriser et afficher un message si le serveur a un problème
            const [erreur, setErreur] = React.useState(null); 
            
            // Je retiens la méthode de recherche utilisée pour adapter le titre des résultats
            const [modeRecherche, setModeRecherche] = React.useState(null); 
            const [genrePioche, setGenrePioche] = React.useState(null); 


            // --- LES ACTIONS (QUAND MON SITE PARLE AU SERVEUR) ---

            // Fonction pour lancer une recherche au hasard
            async function lancerSurprise() {
                setChargement(true); setErreur(null);
                try {
                    // Je pose la question à mon API locale et j'attends sa réponse (await)
                    const reponse = await fetch("http://localhost:8000/surprise");
                    const donnees = await reponse.json(); 
                    
                    // Je range les résultats dans ma mémoire et j'affiche la page des résultats
                    setFilms(donnees.films); 
                    setGenrePioche(donnees.genre_pioche); 
                    setModeRecherche("surprise"); 
                    setPage("resultats"); 
                } catch (e) { setErreur("Impossible de contacter le serveur."); }
                setChargement(false);
            }

            // Fonction pour se déplacer dans les menus et remettre les compteurs à zéro si on retourne à l'accueil
            function allerA(nouvellePage) { 
                setPage(nouvellePage); setErreur(null); 
                if (nouvellePage === "accueil") { 
                    setEtapeTheme(1); setGenre(null); setNomGenre(""); setAmbiance(null); 
                    setActeurNom(""); setActeurTrouve(null); setFilms([]); setModeRecherche(null); 
                } 
            }
            
            // J'enregistre le choix de la question 1 et je passe à la 2
            function choisirGenre(id, nom) { setGenre(id); setNomGenre(nom); setEtapeTheme(2); }
            // J'enregistre le choix de la question 2 et je passe à la 3
            function choisirAmbiance(a) { setAmbiance(a); setEtapeTheme(3); }

            // Fin du questionnaire : j'envoie tous les critères au serveur
            async function choisirDuree(duree) {
                setChargement(true); setErreur(null);
                try {
                    const reponse = await fetch("http://localhost:8000/recommander?mode=theme&genre_id=" + genre + "&duree_max=" + duree + "&ambiance=" + ambiance);
                    const donnees = await reponse.json(); 
                    setFilms(donnees.films); setModeRecherche("theme"); setPage("resultats");
                } catch (e) { setErreur("Impossible de contacter le serveur."); }
                setChargement(false);
            }

            // Je demande au serveur de trouver les films de l'acteur tapé
            async function chercherActeur() {
                // Si la case est vide, on annule l'action
                if (acteurNom.trim() === "") return;
                setChargement(true); setErreur(null);
                try {
                    // encodeURIComponent protège la recherche (s'il y a des espaces dans le nom par exemple)
                    const reponse = await fetch("http://localhost:8000/recommander?mode=acteur&acteur_nom=" + encodeURIComponent(acteurNom));
                    const donnees = await reponse.json(); 
                    setFilms(donnees.films); setActeurTrouve(donnees.acteur_trouve); setModeRecherche("acteur"); setPage("resultats");
                } catch (e) { setErreur("Impossible de contacter le serveur."); }
                setChargement(false);
            }


            // --- CE QUE L'ON VOIT À L'ÉCRAN ---
            return (
                <div>
                    {/* LE BANDEAU D'ACCUEIL : Je l'affiche uniquement si la variable page dit "accueil" */}
                    {page === "accueil" && (
                        <section className="hero is-medium hero-izmar">
                            <div className="hero-body has-text-centered">
                                {/* J'ai mis une belle image d'illustration ici. Le lien peut être remplacé par une image locale comme "./mon-image.jpg" */}
                                <img 
                                    src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" 
                                    alt="Logo IZMAR" 
                                    style={{
                                        width: "150px", 
                                        borderRadius: "20px", 
                                        marginBottom: "15px", 
                                        boxShadow: "0 8px 20px rgba(0,0,0,0.4)"
                                    }} 
                                />
                                <p className="title has-text-white" style={{fontWeight: 600, fontSize: "3rem"}}>IZMAR</p>
                                <p className="subtitle has-text-white mt-2">Trouve ton prochain film en quelques clics</p>
                            </div>
                        </section>
                    )}
                    
                    <section className="section">
                        <div className="container" style={{maxWidth: "750px"}}>

                            {/* LE MENU PRINCIPAL */}
                            {page === "accueil" && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Comment veux-tu choisir ton film ?</h2>
                                    <div className="buttons is-centered">
                                        <button className="button is-danger is-large bouton-choix" onClick={function() { allerA("theme"); }}>Par thème</button>
                                        <button className="button is-info is-large bouton-choix" onClick={function() { allerA("acteur"); }}>Par acteur</button>
                                        <button className="button is-warning is-large bouton-choix" onClick={lancerSurprise}>Surprise</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE THÈME : QUESTION 1 */}
                            {page === "theme" && etapeTheme === 1 && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Quel genre de film ?</h2>
                                    <div className="buttons is-centered">
                                        {/* J'envoie l'identifiant secret de TMDB (ex: 28 pour Action) et le vrai nom */}
                                        <button className="button is-warning is-medium bouton-choix" onClick={function() { choisirGenre(28, "Action"); }}>Action</button>
                                        <button className="button is-success is-medium bouton-choix" onClick={function() { choisirGenre(35, "Comédie"); }}>Comédie</button>
                                        <button className="button is-dark is-medium bouton-choix" onClick={function() { choisirGenre(27, "Horreur"); }}>Horreur</button>
                                        <button className="button is-danger is-medium bouton-choix" onClick={function() { choisirGenre(10749, "Romance"); }}>Romance</button>
                                        <button className="button is-info is-medium bouton-choix" onClick={function() { choisirGenre(18, "Drame"); }}>Drame</button>
                                        <button className="button is-link is-medium bouton-choix" onClick={function() { choisirGenre(53, "Thriller"); }}>Thriller</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE THÈME : QUESTION 2 */}
                            {page === "theme" && etapeTheme === 2 && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Plutôt récent ou classique ? ({nomGenre})</h2>
                                    <div className="buttons is-centered">
                                        <button className="button is-info is-medium bouton-choix" onClick={function() { choisirAmbiance("recent"); }}>Récent</button>
                                        <button className="button is-warning is-medium bouton-choix" onClick={function() { choisirAmbiance("classique"); }}>Classique</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE THÈME : QUESTION 3 */}
                            {page === "theme" && etapeTheme === 3 && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Quelle durée maximum ?</h2>
                                    <div className="buttons is-centered">
                                        {/* Si 'chargement' est vrai, le bouton affiche un symbole de chargement grâce à la classe 'is-loading' */}
                                        <button className={"button is-primary is-medium bouton-choix " + (chargement ? "is-loading" : "")} onClick={function() { choisirDuree(90); }} disabled={chargement}>1h30</button>
                                        <button className={"button is-primary is-medium bouton-choix " + (chargement ? "is-loading" : "")} onClick={function() { choisirDuree(120); }} disabled={chargement}>2h</button>
                                        <button className={"button is-primary is-medium bouton-choix " + (chargement ? "is-loading" : "")} onClick={function() { choisirDuree(180); }} disabled={chargement}>3h</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE DE RECHERCHE PAR ACTEUR */}
                            {page === "acteur" && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Quel est ton acteur préféré ?</h2>
                                    <div className="field has-addons has-addons-centered">
                                        <div className="control is-expanded"><input className="input is-medium" type="text" placeholder="Ex : Tom Hanks..." value={acteurNom} onChange={function(e) { setActeurNom(e.target.value); }} /></div>
                                        <div className="control"><button className={"button is-info is-medium " + (chargement ? "is-loading" : "")} onClick={chercherActeur} disabled={chargement}>Chercher</button></div>
                                    </div>
                                </div>
                            )}

                            {/* AFFICHAGE DES ERREURS SERVEUR */}
                            {erreur && (<div className="notification is-danger mt-4" style={{borderRadius: "10px"}}>{erreur}</div>)}

                            {/* LA PAGE DES RÉSULTATS */}
                            {page === "resultats" && (
                                <div>
                                    <h2 className="title is-4 has-text-white has-text-centered mb-5">Voici les résultats !</h2>
                                    
                                    {/* Je prends mon tableau de films et je génère un bloc HTML pour chacun d'entre eux */}
                                    {films.map(function(film, index) {
                                        return (
                                            <div className="box box-sombre carte-film" key={index} style={{marginBottom: "20px"}}>
                                                <div className="columns is-vcentered">
                                                    {/* J'applique ma classe affiche-film pour harmoniser les tailles d'images */}
                                                    <div className="column is-narrow has-text-centered">
                                                        {film.affiche && (<img src={film.affiche} alt={film.titre} className="affiche-film" />)}
                                                    </div>
                                                    <div className="column">
                                                        <p className="title is-5 has-text-white" style={{fontWeight: 600}}>{film.titre}</p>
                                                        <div className="tags">
                                                            <span className="tag is-dark is-medium">{film.annee}</span>
                                                            {/* J'ajoute une petite étoile devant la note */}
                                                            <span className="tag is-warning is-medium"><i className="fas fa-star mr-1"></i> {film.note}/10</span>
                                                        </div>
                                                        <p className="texte-clair mt-2">{film.synopsis}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    
                                    {/* Bouton pour relancer l'expérience */}
                                    <div className="has-text-centered mt-5"><button className="button is-warning is-medium bouton-choix" style={{borderRadius: "30px", padding: "0 30px"}} onClick={function() { allerA("accueil"); }}>Nouvelle recherche</button></div>
                                </div>
                            )}

                        </div>
                    </section>
                </div>
            );
        }
        
        // Commande finale : on dit à React de dessiner tout ce qu'on vient de définir à l'intérieur de notre balise racine
        const racine = ReactDOM.createRoot(document.getElementById("racine"));
        racine.render(<App />);
    </script>
</body>
</html>
