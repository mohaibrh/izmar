<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Les réglages de base de ma page -->
    <!-- Ici, je dis au navigateur de bien comprendre les accents comme é, à, ç -->
    <meta charset="UTF-8" />
    <!-- Là, je m'assure que mon site s'affiche bien sur téléphone, sans qu'on ait besoin de zoomer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IZMAR - Recommandation de Films</title>
    
    <!-- Pour faire un joli site rapidement, j'utilise "Bulma". C'est un fichier qui contient des décorations toutes prêtes (des beaux boutons, des belles couleurs) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
    <!-- Ça, c'est juste pour pouvoir utiliser des petites icônes (comme la pellicule de film) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- J'ajoute "React". C'est le moteur de mon site. Ça me permet de changer ce qu'il y a à l'écran sans jamais avoir besoin de recharger la page -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel est un "traducteur". Il permet au navigateur de comprendre mon code React -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Quelques couleurs personnalisées pour donner une ambiance "cinéma" sombre à mon site -->
    <style>
        body { background-color: #1a1a2e; min-height: 100vh; }
        .hero-izmar { background: linear-gradient(135deg, #0f3460, #e94560); }
        .box-sombre { background-color: #16213e; color: #ffffff; }
        .texte-clair { color: #cccccc; }
        .carte-film:hover { box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3); }
        .bouton-choix { margin: 5px; }
    </style>
</head>
<body>
    <!-- C'est ici que mon site va s'afficher. C'est une boîte vide que React va remplir tout seul. -->
    <div id="racine"></div>
    
    <script type="text/babel">
        
        // C'est la grande fonction qui contient tout mon site
        function App() {
            
            // --- LA MÉMOIRE DE MON SITE ---
            // J'utilise "useState" pour créer des cases mémoire. 
            // La magie de React, c'est que si je change ce qu'il y a dans une de ces cases, 
            // l'écran se met à jour tout seul pour afficher la nouveauté.
            
            // Je retiens sur quelle page on se trouve. Au début, on est à l'"accueil"
            const [page, setPage] = React.useState("accueil"); 
            // Si l'utilisateur choisit par thème, je retiens à quelle question il en est (1, 2 ou 3)
            const [etapeTheme, setEtapeTheme] = React.useState(1); 
            
            // Je mémorise les choix de l'utilisateur quand il clique sur des boutons
            const [genre, setGenre] = React.useState(null); 
            const [nomGenre, setNomGenre] = React.useState(""); 
            const [ambiance, setAmbiance] = React.useState(null); 
            
            // Je mémorise ce qu'il tape au clavier quand il cherche un acteur
            const [acteurNom, setActeurNom] = React.useState(""); 
            const [acteurTrouve, setActeurTrouve] = React.useState(null); 
            
            // C'est ici que je rangerai la liste des films que le serveur va me donner
            const [films, setFilms] = React.useState([]); 
            
            // Je retiens si le site est "en train de chercher" pour afficher une animation d'attente
            const [chargement, setChargement] = React.useState(false); 
            // Si le serveur a un problème, je mémorise le message d'erreur ici
            const [erreur, setErreur] = React.useState(null); 
            
            // Je retiens comment on a cherché (par "theme", "acteur" ou "surprise")
            const [modeRecherche, setModeRecherche] = React.useState(null); 
            const [genrePioche, setGenrePioche] = React.useState(null); 


            // --- LES ACTIONS (QUAND ON PARLE AU SERVEUR) ---

            // Fonction pour le bouton "Surprise"
            async function lancerSurprise() {
                setChargement(true); // Je dis au site "Affiche que tu cherches"
                setErreur(null); // J'efface les vieilles erreurs
                
                try {
                    // Je pose une question à mon serveur (mon programme en python). 
                    // Le mot "await" veut dire : "Attends que le serveur réponde avant de continuer le code".
                    const reponse = await fetch("http://localhost:8000/surprise");
                    // Je traduis la réponse du serveur pour que mon site la comprenne
                    const donnees = await reponse.json(); 
                    
                    // Je range ce que le serveur m'a donné dans la mémoire de mon site
                    setFilms(donnees.films); 
                    setGenrePioche(donnees.genre_pioche); 
                    setModeRecherche("surprise"); 
                    // Et je dis au site de changer de page pour afficher les résultats
                    setPage("resultats"); 
                } catch (e) { 
                    // Si mon serveur est éteint, je mets un message d'erreur dans la mémoire
                    setErreur("Impossible de contacter le serveur."); 
                }
                setChargement(false); // Je dis au site "C'est bon, la recherche est finie"
            }

            // Fonction pour changer d'écran ou revenir à l'accueil
            function allerA(nouvellePage) { 
                setPage(nouvellePage); 
                setErreur(null); 
                // Si on retourne à l'accueil, je vide toutes les mémoires pour repartir de zéro
                if (nouvellePage === "accueil") { 
                    setEtapeTheme(1); setGenre(null); setNomGenre(""); setAmbiance(null); 
                    setActeurNom(""); setActeurTrouve(null); setFilms([]); setModeRecherche(null); 
                } 
            }
            
            // Les fonctions quand on clique sur les boutons de Thème
            // Quand on choisit un genre, je le mémorise et je passe à la question 2
            function choisirGenre(id, nom) { setGenre(id); setNomGenre(nom); setEtapeTheme(2); }
            // Quand on choisit l'époque, je la mémorise et je passe à la question 3
            function choisirAmbiance(a) { setAmbiance(a); setEtapeTheme(3); }

            // Quand on clique sur la durée, c'est la fin du questionnaire : j'interroge le serveur
            async function choisirDuree(duree) {
                setChargement(true); setErreur(null);
                try {
                    // Je crée un lien avec tous les choix que l'utilisateur a faits, et je l'envoie au serveur
                    const reponse = await fetch("http://localhost:8000/recommander?mode=theme&genre_id=" + genre + "&duree_max=" + duree + "&ambiance=" + ambiance);
                    const donnees = await reponse.json(); 
                    
                    setFilms(donnees.films); setModeRecherche("theme"); setPage("resultats");
                } catch (e) { setErreur("Impossible de contacter le serveur."); }
                setChargement(false);
            }

            // Fonction quand on clique sur "Chercher" pour un acteur
            async function chercherActeur() {
                // Si la case texte est vide, j'arrête tout, ça ne sert à rien de chercher
                if (acteurNom.trim() === "") return;
                
                setChargement(true); setErreur(null);
                try {
                    // J'envoie le nom tapé au clavier à mon serveur
                    const reponse = await fetch("http://localhost:8000/recommander?mode=acteur&acteur_nom=" + encodeURIComponent(acteurNom));
                    const donnees = await reponse.json(); 
                    
                    setFilms(donnees.films); setActeurTrouve(donnees.acteur_trouve); setModeRecherche("acteur"); setPage("resultats");
                } catch (e) { setErreur("Impossible de contacter le serveur."); }
                setChargement(false);
            }

            // --- L'AFFICHAGE (CE QU'ON VOIT A L'ECRAN) ---
            return (
                <div>
                    {/* Le grand titre du haut. Je dis "Si on est sur l'accueil, alors affiche le titre" */}
                    {page === "accueil" && (
                        <section className="hero is-medium hero-izmar">
                            <div className="hero-body has-text-centered">
                                <span className="icon is-large has-text-white"><i className="fas fa-film fa-3x"></i></span>
                                <p className="title has-text-white mt-3">IZMAR</p>
                                <p className="subtitle has-text-white">Trouve ton prochain film en quelques clics</p>
                            </div>
                        </section>
                    )}
                    
                    <section className="section">
                        <div className="container" style={{maxWidth: "750px"}}>

                            {/* LE MENU PRINCIPAL */}
                            {/* Les signes "&&" veulent dire "Si la page est 'accueil', affiche le bloc HTML qui suit" */}
                            {page === "accueil" && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Comment veux-tu choisir ton film ?</h2>
                                    <div className="buttons is-centered">
                                        <button className="button is-danger is-large bouton-choix" onClick={function() { allerA("theme"); }}>Par thème</button>
                                        <button className="button is-info is-large bouton-choix" onClick={function() { allerA("acteur"); }}>Par acteur</button>
                                        <button className="button is-warning is-large bouton-choix" onClick={lancerSurprise}>Surprise</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE THEME : QUESTION 1 */}
                            {page === "theme" && etapeTheme === 1 && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Quel genre de film ?</h2>
                                    <div className="buttons is-centered">
                                        {/* Quand je clique, ça mémorise le chiffre (qui est le code du genre pour mon serveur) et le mot */}
                                        <button className="button is-warning is-medium bouton-choix" onClick={function() { choisirGenre(28, "Action"); }}>Action</button>
                                        <button className="button is-success is-medium bouton-choix" onClick={function() { choisirGenre(35, "Comédie"); }}>Comédie</button>
                                        <button className="button is-dark is-medium bouton-choix" onClick={function() { choisirGenre(27, "Horreur"); }}>Horreur</button>
                                        <button className="button is-danger is-medium bouton-choix" onClick={function() { choisirGenre(10749, "Romance"); }}>Romance</button>
                                        <button className="button is-info is-medium bouton-choix" onClick={function() { choisirGenre(18, "Drame"); }}>Drame</button>
                                        <button className="button is-link is-medium bouton-choix" onClick={function() { choisirGenre(53, "Thriller"); }}>Thriller</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE THEME : QUESTION 2 */}
                            {page === "theme" && etapeTheme === 2 && (
                                <div className="box box-sombre has-text-centered">
                                    {/* Les accolades {nomGenre} permettent d'écrire le texte que j'ai mémorisé juste avant */}
                                    <h2 className="title is-4 has-text-white">Plutôt récent ou classique ? ({nomGenre})</h2>
                                    <div className="buttons is-centered">
                                        <button className="button is-info is-medium bouton-choix" onClick={function() { choisirAmbiance("recent"); }}>Récent</button>
                                        <button className="button is-warning is-medium bouton-choix" onClick={function() { choisirAmbiance("classique"); }}>Classique</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE THEME : QUESTION 3 */}
                            {page === "theme" && etapeTheme === 3 && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Quelle durée maximum ?</h2>
                                    <div className="buttons is-centered">
                                        {/* Quand je clique, la fonction choisirDuree lance la recherche finale */}
                                        <button className="button is-primary is-medium bouton-choix" onClick={function() { choisirDuree(90); }}>1h30</button>
                                        <button className="button is-primary is-medium bouton-choix" onClick={function() { choisirDuree(120); }}>2h</button>
                                        <button className="button is-primary is-medium bouton-choix" onClick={function() { choisirDuree(180); }}>3h</button>
                                    </div>
                                </div>
                            )}

                            {/* LA PAGE RECHERCHE PAR ACTEUR */}
                            {page === "acteur" && (
                                <div className="box box-sombre has-text-centered">
                                    <h2 className="title is-4 has-text-white">Quel est ton acteur préféré ?</h2>
                                    <div className="field has-addons has-addons-centered">
                                        {/* Quand je tape au clavier, le "onChange" lit les lettres et les sauvegarde dans ma mémoire */}
                                        <div className="control is-expanded"><input className="input is-medium" type="text" placeholder="Ex : Tom Hanks..." value={acteurNom} onChange={function(e) { setActeurNom(e.target.value); }} /></div>
                                        <div className="control"><button className="button is-info is-medium" onClick={chercherActeur}>Chercher</button></div>
                                    </div>
                                </div>
                            )}

                            {/* SI LE SERVEUR BUG, J'AFFICHE ÇA */}
                            {erreur && (<div className="notification is-danger mt-4">{erreur}</div>)}

                            {/* L'AFFICHAGE DES RESULTATS FINAUX */}
                            {page === "resultats" && (
                                <div>
                                    <h2 className="title is-4 has-text-white has-text-centered mb-5">Voici les résultats !</h2>
                                    
                                    {/* Je prends mon tableau de films et pour CHAQUE film, je dessine ce bloc visuel */}
                                    {films.map(function(film, index) {
                                        return (
                                            <div className="box box-sombre carte-film" key={index} style={{marginBottom: "20px"}}>
                                                <div className="columns">
                                                    {/* J'affiche l'image du film (l'affiche) */}
                                                    <div className="column is-narrow"><img src={film.affiche} alt={film.titre} style={{width: "150px", borderRadius: "5px"}} /></div>
                                                    <div className="column">
                                                        {/* J'affiche le titre, l'année, la note et l'histoire du film */}
                                                        <p className="title is-5 has-text-white">{film.titre}</p>
                                                        <div className="tags"><span className="tag is-dark">{film.annee}</span><span className="tag is-warning">{film.note}/10</span></div>
                                                        <p className="texte-clair">{film.synopsis}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    
                                    {/* Le bouton pour faire une nouvelle recherche */}
                                    <div className="has-text-centered mt-5"><button className="button is-warning is-medium" onClick={function() { allerA("accueil"); }}>Nouvelle recherche</button></div>
                                </div>
                            )}

                        </div>
                    </section>
                </div>
            );
        }
        
        // C'est l'ordre final : "Prends tout ce que je viens de créer au-dessus (App), et colle-le sur la page HTML"
        const racine = ReactDOM.createRoot(document.getElementById("racine"));
        racine.render(<App />);
    </script>
</body>
</html>
