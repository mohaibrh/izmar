<!--
Projet IZMAR - Mon Frontend
C'est l'interface de mon app. J'ai fait au plus simple : une seule page pour chercher des films.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IZMAR - Recommandation de Films</title>

    <!-- J'importe Bulma pour avoir un design propre rapidement, sans me prendre la tête avec plein de CSS perso -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- J'utilise React directement via des liens CDN. Pour un projet de cette taille, c'est plus direct que de configurer tout un environnement Node.js -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #1a1a2e; min-height: 100vh; }
        .hero-izmar { background: linear-gradient(135deg, #0f3460, #e94560); }
        .box-sombre { background-color: #16213e; color: #ffffff; }
        .texte-clair { color: #cccccc; }
    </style>
</head>
<body>

    <!-- C'est la balise vide où React va venir "dessiner" toute l'application -->
    <div id="racine"></div>

    <script type="text/babel">
        function App() {
            // Mes variables d'état. La magie de React, c'est que si je modifie une de ces valeurs, l'affichage se met à jour tout seul.
            const [mode, setMode] = React.useState("theme");
            const [genre, setGenre] = React.useState("28");
            const [duree, setDuree] = React.useState("120");
            const [acteurNom, setActeurNom] = React.useState("");
            const [acteurTrouve, setActeurTrouve] = React.useState(null);
            const [films, setFilms] = React.useState([]);
            const [chargement, setChargement] = React.useState(false);
            const [erreur, setErreur] = React.useState(null);

            // Je mets 'async' pour que mon interface ne freeze pas pendant que le serveur cherche les infos
            async function chercherParTheme() {
                setChargement(true);
                setErreur(null);
                try {
                    // J'envoie ma requête au backend en lui passant ce que l'utilisateur a sélectionné
                    const reponse = await fetch(
                        "http://localhost:8000/recommander?mode=theme&genre_id=" + genre + "&duree_max=" + duree
                    );
                    const donnees = await reponse.json(); 
                    setFilms(donnees.films); // Je stocke les films reçus pour les afficher
                    setActeurTrouve(null);
                } catch (e) {
                    setErreur("Impossible de contacter le serveur. Vérifie que le backend est lancé.");
                }
                setChargement(false);
            }

            // Même logique ici, mais pour la recherche par acteur
            async function chercherParActeur() {
                if (acteurNom.trim() === "") return; // Petite sécurité pour éviter les recherches vides
                setChargement(true);
                setErreur(null);
                try {
                    const reponse = await fetch(
                        "http://localhost:8000/recommander?mode=acteur&acteur_nom=" + encodeURIComponent(acteurNom)
                    );
                    const donnees = await reponse.json();
                    setFilms(donnees.films);
                    setActeurTrouve(donnees.acteur_trouve);
                } catch (e) {
                    setErreur("Impossible de contacter le serveur. Vérifie que le backend est lancé.");
                }
                setChargement(false);
            }

            return (
                <div>
                    <section className="hero is-medium hero-izmar">
                        <div className="hero-body has-text-centered">
                            <span className="icon is-large has-text-white"><i className="fas fa-film fa-3x"></i></span>
                            <p className="title has-text-white mt-3">IZMAR</p>
                            <p className="subtitle has-text-white">Trouve ton film</p>
                        </div>
                    </section>

                    <section className="section">
                        <div className="container" style={{maxWidth: "600px"}}>

                            {/* Mes onglets pour basculer entre la recherche par thème ou par acteur */}
                            <div className="tabs is-centered is-toggle is-toggle-rounded">
                                <ul>
                                    <li className={mode === "theme" ? "is-active" : ""}>
                                        <a onClick={function() { setMode("theme"); setFilms([]); }}>
                                            <span className="icon is-small"><i className="fas fa-theater-masks"></i></span>
                                            <span>Par thème</span>
                                        </a>
                                    </li>
                                    <li className={mode === "acteur" ? "is-active" : ""}>
                                        <a onClick={function() { setMode("acteur"); setFilms([]); }}>
                                            <span className="icon is-small"><i className="fas fa-user"></i></span>
                                            <span>Par acteur</span>
                                        </a>
                                    </li>
                                </ul>
                            </div>

                            {/* Si on est en mode "theme", j'affiche ce bloc */}
                            {mode === "theme" && (
                                <div className="box box-sombre">
                                    <div className="field">
                                        <label className="label has-text-white">Quel genre ?</label>
                                        <div className="select is-fullwidth">
                                            <select value={genre} onChange={function(e) { setGenre(e.target.value); }}>
                                                <option value="28">Action</option>
                                                <option value="35">Comédie</option>
                                                <option value="18">Drame</option>
                                                <option value="27">Horreur</option>
                                                <option value="10749">Romance</option>
                                                <option value="53">Thriller</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="field">
                                        <label className="label has-text-white">Quelle durée max ?</label>
                                        <div className="select is-fullwidth">
                                            <select value={duree} onChange={function(e) { setDuree(e.target.value); }}>
                                                <option value="90">1h30</option>
                                                <option value="120">2h</option>
                                                <option value="180">3h</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button className={"button is-danger is-fullwidth " + (chargement ? "is-loading" : "")} onClick={chercherParTheme} disabled={chargement}>
                                        <span className="icon"><i className="fas fa-search"></i></span>
                                        <span>Trouver un film</span>
                                    </button>
                                </div>
                            )}

                            {/* Si on est en mode "acteur", j'affiche l'autre bloc */}
                            {mode === "acteur" && (
                                <div className="box box-sombre">
                                    <div className="field">
                                        <label className="label has-text-white">Quel est ton acteur préféré ?</label>
                                        <div className="field has-addons">
                                            <div className="control is-expanded">
                                                <input className="input" type="text" placeholder="Ex : Tom Hanks, Léa Seydoux..." value={acteurNom} onChange={function(e) { setActeurNom(e.target.value); }} />
                                            </div>
                                            <div className="control">
                                                <button className={"button is-info " + (chargement ? "is-loading" : "")} onClick={chercherParActeur} disabled={chargement}>
                                                    <span className="icon"><i className="fas fa-search"></i></span>
                                                    <span>Chercher</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Pour gérer les pépins proprement */}
                            {erreur && (
                                <div className="notification is-danger">
                                    <span className="icon"><i className="fas fa-exclamation-triangle"></i></span>
                                    <span>{erreur}</span>
                                </div>
                            )}
                        </div>
                    </section>

                    <section className="section" style={{paddingTop: "0"}}>
                        <div className="container" style={{maxWidth: "750px"}}>
                            
                            {films.length > 0 && mode === "acteur" && acteurTrouve && (
                                <h2 className="title is-4 has-text-white has-text-centered mb-5">
                                    <span className="icon"><i className="fas fa-star"></i></span>
                                    <span>Les meilleurs films avec {acteurTrouve}</span>
                                </h2>
                            )}
                            {films.length > 0 && mode === "theme" && (
                                <h2 className="title is-4 has-text-white has-text-centered mb-5">
                                    <span className="icon"><i className="fas fa-star"></i></span>
                                    <span>Mes recommandations</span>
                                </h2>
                            )}

                            {/* C'est ici que je boucle sur ma liste de films pour créer les petites cartes d'affichage */}
                            {films.map(function(film, index) {
                                return (
                                    <div className="box box-sombre" key={index} style={{marginBottom: "20px"}}>
                                        <div className="columns">
                                            <div className="column is-narrow">
                                                {film.affiche && (<figure className="image"><img src={film.affiche} alt={film.titre} style={{width: "150px", borderRadius: "5px"}} /></figure>)}
                                            </div>
                                            <div className="column">
                                                <p className="title is-5 has-text-white">{film.titre} ({film.annee})</p>
                                                <p className="texte-clair">{film.synopsis}</p>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    <footer className="footer" style={{backgroundColor: "#0f3460", padding: "20px"}}>
                        <div className="content has-text-centered has-text-white">
                            <p><span className="icon"><i className="fas fa-code"></i></span> IZMAR — React, FastAPI, SQLite et Docker</p>
                            <p className="is-size-7 texte-clair">Données fournies par TMDB</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const racine = ReactDOM.createRoot(document.getElementById("racine"));
        racine.render(<App />);
    </script>
</body>
</html>
